name: Deploy to Server

on:
  push:
    branches:
      - main # Run this workflow when code is pushed to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Install Docker Compose
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.5.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version  # Verify installation

      # Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Stop existing Docker containers using docker-compose
      - name: Stop existing containers
        run: |
          docker-compose down

      # Build and restart Docker Compose
      - name: Build and restart Docker Compose
        run: |
          docker-compose build --no-cache
          docker-compose up -d

      # Optional: Clean up unused Docker images
      - name: Remove unused Docker images
        run: |
          docker system prune -af
