name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Docker Buildx (to build Docker images)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Stop any existing Docker containers using docker-compose
      - name: Stop existing containers
        run: |
          docker-compose down

      # Build and rebuild Docker containers
      - name: Build and restart Docker Compose
        run: |
          docker-compose pull  # Optional if you're using external images
          docker-compose build --no-cache  # Rebuild the images
          docker-compose up -d  # Restart containers in detached mode
